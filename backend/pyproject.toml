[project]
name = "insightpulse-backend"
version = "0.1.0"
description = "InsightPulse AI - analytics API (pandas, Matplotlib/Seaborn, ML, LLM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "prophet>=1.1.6",
    "statsmodels>=0.14.4",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "joblib>=1.4",
    "holidays>=0.60",
    "anthropic>=1.0",
    "google-auth>=2.30",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"app/ml/*" = ["N803", "N806"]  # X / X_train: scikit-learn convention

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
