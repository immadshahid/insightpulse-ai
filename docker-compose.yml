services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightpulse}
      POSTGRES_DB: ${POSTGRES_DB:-insightpulse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightpulse}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-insightpulse}:${POSTGRES_PASSWORD:-insightpulse}@postgres:5432/${POSTGRES_DB:-insightpulse}
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
